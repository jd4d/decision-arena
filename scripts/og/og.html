<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0}
body{width:1200px;height:630px;overflow:hidden;position:relative;background:#06080c;color:#e8eef6;
font-family:Inter,"SF Pro Text",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.glow{position:absolute;inset:0;background:radial-gradient(520px 380px at 12% 100%,rgba(56,217,245,.16),transparent 70%),radial-gradient(520px 380px at 92% 0%,rgba(255,157,60,.15),transparent 70%)}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(142,155,176,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(142,155,176,.07) 1px,transparent 1px);background-size:60px 60px;
-webkit-mask-image:radial-gradient(ellipse at 50% 50%,#000 30%,transparent 80%)}
.bigmark{position:absolute;right:-90px;top:50%;width:620px;height:620px;transform:translateY(-50%);opacity:.45}
.content{position:absolute;left:84px;top:0;bottom:0;display:flex;flex-direction:column;justify-content:center;width:660px}
.brand{display:flex;align-items:center;gap:22px}
.brand svg{width:84px;height:84px}
.word{font-weight:500;letter-spacing:.16em;text-transform:uppercase;font-size:40px;color:#8e9bb0}
.word b{color:#e8eef6;font-weight:800;margin-left:16px}
.bar{height:4px;width:240px;margin:44px 0 36px;border-radius:2px;background:linear-gradient(90deg,#38d9f5,#ff9d3c)}
h1{white-space:nowrap;margin:0;font-size:68px;font-weight:800;letter-spacing:-.02em;line-height:1}
p{margin:26px 0 0;font-size:31px;line-height:1.35;color:#8e9bb0;max-width:620px}
p b{color:#e8eef6;font-weight:600}
.vs{position:absolute;left:84px;bottom:48px;font-size:20px;letter-spacing:.08em;color:#8e9bb0;display:flex;gap:12px;align-items:center}
i{width:12px;height:12px;border-radius:50%;display:inline-block}
.j{background:#38d9f5;box-shadow:0 0 12px rgba(56,217,245,.7)}.m{background:#ff9d3c;box-shadow:0 0 12px rgba(255,157,60,.7)}
.url{position:absolute;right:60px;bottom:48px;font-size:22px;letter-spacing:.06em;color:#8e9bb0}
</style></head><body>
<div class="glow"></div><div class="grid"></div>
<svg class="bigmark" viewBox="0 0 32 32" opacity=".28"><circle cx="16" cy="16" r="9" fill="none" stroke="#38d9f5" stroke-width="2.4"/><path d="M16 2.5v7M16 22.5v7M2.5 16h7M22.5 16h7" stroke="#ff9d3c" stroke-width="2.4" stroke-linecap="round"/><circle cx="16" cy="16" r="2.2" fill="#e8eef6"/></svg>
<div class="content">
<div class="brand"><svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="9" fill="none" stroke="#38d9f5" stroke-width="2.4"/><path d="M16 2.5v7M16 22.5v7M2.5 16h7M22.5 16h7" stroke="#ff9d3c" stroke-width="2.4" stroke-linecap="round"/><circle cx="16" cy="16" r="2.2" fill="#e8eef6"/></svg><span class="word">Decision<b>Arena</b></span></div>
<div class="bar"></div>
<h1>Decision Arena AI</h1>
<p>Decision models fight it out in real time. <b>The benchmark that really matters.</b></p>
</div>
<div class="vs"><i class="j"></i>JEV 1.13 <span>VS</span> <i class="m"></i>MICROSOFT DECISION 1</div>
<div class="url">decisionarena.ai</div>
</body></html>
